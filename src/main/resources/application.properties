spring.application.name=finflow
spring.datasource.url=jdbc:postgresql://localhost:5432/finflow
spring.datasource.username=postgres
spring.datasource.password=rohit

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.request.timeout.ms=30000
spring.kafka.consumer.properties.default.api.timeout.ms=30000

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shitoler9666@gmail.com
spring.mail.password=mxxy mbbc ryrg tylv

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#Redis
spring.redis.host=localhost
spring.redis.port=6379

#remove noice from terminal
logging.level.root=INFO
logging.level.com.rohit.finflow=INFO
logging.level.org.springframework=INFO
logging.level.org.apache.kafka=INFO

# =========================
# Tomcat HTTP Server
# =========================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=100
server.tomcat.accept-count=200

# =========================
# Database Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
